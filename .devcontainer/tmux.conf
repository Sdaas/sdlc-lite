# tmux.conf — the container's ~/.tmux.conf, for hands-off T3 runs (#66).
#
# Installed by post-start.sh (REFRESH: overwritten every start). A running tmux
# server ignores edits: after changing this file, `tmux kill-server` in the
# container (make clean-run does that by removing the container).
# Guide: dev-docs/t3-runs.md.

# Scroll with the wheel, click to focus, drag to copy.
set -g mouse on

# Keep a long scrollback: a full /implement-feature run prints a lot.
set -g history-limit 50000

# Shift+Enter inserts a newline in Claude Code instead of submitting. Without these,
# tmux flattens the modified-key sequence back to a bare Enter.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'tmux*:extkeys'

# A mouse-drag copy reaches the Mac clipboard via OSC 52 (in iTerm2, allow it under
# Settings → General → Selection → "Applications in terminal may access clipboard").
set -g set-clipboard on

# Keep the pane after claude exits, so the final screen stays readable and
# `t3-run.sh watch` can tell "ended" from "gone".
set -g remain-on-exit on
